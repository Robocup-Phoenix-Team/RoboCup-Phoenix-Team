name: Compress images & PR

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  compress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jpegoptim optipng

      - name: Measure original size
        id: before
        run: |
          echo "size=$(du -sb . | cut -f1)" >> $GITHUB_OUTPUT

      - name: Compress JPG/JPEG
        run: |
          find . -type f \( -name "*.jpg" -o -name "*.jpeg" \) \
          -exec jpegoptim --max=80 --strip-all {} \;

      - name: Compress PNG
        run: |
          find . -type f -name "*.png" -exec optipng -o2 {} \;

      - name: Measure new size
        id: after
        run: |
          echo "size=$(du -sb . | cut -f1)" >> $GITHUB_OUTPUT

      - name: Compute saved space
        id: diff
        run: |
          before=${{ steps.before.outputs.size }}
          after=${{ steps.after.outputs.size }}
          saved=$((before - after))
          echo "saved=$saved" >> $GITHUB_OUTPUT
      - name: Create branch
        run: |
          BRANCH="compress-images-${GITHUB_RUN_ID}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git checkout -b "$BRANCH"
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
      
          git diff --cached --quiet && exit 0
      
          git commit -m "chore: compress images"
      
      - name: Push branch
        run: |
          git push origin $BRANCH
      
      - name: Create PR
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "🗜️ Image compression" \
            --body "Compression automatique"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Create branch
              run: |
                BRANCH="compress-images-${GITHUB_RUN_ID}"
                echo "BRANCH=$BRANCH" >> $GITHUB_ENV
                git checkout -b "$BRANCH"
