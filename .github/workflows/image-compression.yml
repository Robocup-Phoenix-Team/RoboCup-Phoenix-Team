name: Compress images

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  compress-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jpegoptim optipng

      - name: Compress JPG/JPEG images
        run: |
          find . -type f \( -name "*.jpg" -o -name "*.jpeg" \) -exec jpegoptim --max=80 --strip-all {} \;

      - name: Compress PNG images
        run: |
          find . -type f -name "*.png" -exec optipng -o2 {} \;

      - name: Commit changes (if any)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: compress images"
            git push
          else
            echo "No changes to commit"
          fi
